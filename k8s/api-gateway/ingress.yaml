# Porta de entrada da aplicação. Toda requisição externa chega no gateway,
# que valida o JWT antes de encaminhar para auth, quadras ou reservas.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  labels:
    app: api-gateway
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
