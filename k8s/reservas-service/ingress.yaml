apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: reservas-service-ingress
  labels:
    app: reservas-service
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /reservas
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
