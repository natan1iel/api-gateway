# Rota pública do auth-service. O backend é o api-gateway, e não o próprio
# serviço: o auth-service confia nos headers X-Usuario-* que só o gateway
# preenche depois de validar o JWT. Expor o serviço direto permitiria
# forjar esses headers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service-ingress
  labels:
    app: auth-service
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
