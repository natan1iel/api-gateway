apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quadras-service-hpa
  labels:
    app: quadras-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quadras-service
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
